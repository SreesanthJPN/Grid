[workspace]
resolver = "2"
members = [
    "crates/og-crypto",
    "crates/og-protocol",
    "crates/og-transport",
    "crates/og-relay",
    "crates/og-cli",
    "crates/og-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
# --- crypto primitives (og-crypto) ---
snow = "0.10.0"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
curve25519-dalek = "4.1"
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
sha2 = "0.10"
blake3 = "1.8.7"
argon2 = "0.5.3"
zeroize = { version = "1.8.2", features = ["derive"] }
keyring = "3.6.3"
ml-kem = "0.3.2"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2.6"

# --- wire protocol (og-protocol) ---
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
bech32 = "0.11"

# --- transport (og-transport, og-relay) ---
quinn = "0.11.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-socks = "0.5"
rcgen = "0.14.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std"] }

# --- mobile bindings (og-ffi) ---
uniffi = "0.29"

# --- cli (og-cli) ---
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }

# --- shared ---
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
